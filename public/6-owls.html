<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>O.W.L.s | PeriodiCastle</title>

  <link rel="stylesheet" href="css/6-owls.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond&display=swap" rel="stylesheet">
</head>

<body>
  <main class="owls-page">

    <!-- HEADER -->
    <header class="owls-header">
      <h1>🦉 O.W.L.s — Ordinary Wizarding Levels of Chemistry</h1>
      <p>Test your mastery of the Elements and earn your magical marks!</p>
    </header>

    <!-- MAIN CONTENT -->
    <section class="owls-content">

      <!-- LEFT PANEL -->
      <aside class="panel left-panel">
        <h2>Select Quiz Mode</h2>

        <ul class="mode-list">
          <li class="mode active" data-mode="rapid">House Rapid-Fire</li>
          <li class="mode" data-mode="block">Block Sort</li>
          <li class="mode" data-mode="trends">Trends</li>
          <li class="mode" data-mode="identify">Identify Element</li>
        </ul>
      </aside>

      <!-- RIGHT PANEL -->
      <section class="panel right-panel">

        <div id="mode-title">House Rapid-Fire</div>

        <div id="question-text" class="question">
          Which House does Oxygen belong to?
        </div>

        <div class="choices">
          <button class="choice-btn" data-house="Gryffindor">Gryffindor</button>
          <button class="choice-btn" data-house="Slytherin">Slytherin</button>
          <button class="choice-btn" data-house="Hufflepuff">Hufflepuff</button>
          <button class="choice-btn" data-house="Ravenclaw">Ravenclaw</button>
        </div>

        <div class="stats">
          <span id="score">Score: 0/10</span>
          <span id="timer">⏳ 30</span>
          <span id="lives">❤️❤️❤️</span>
        </div>

      </section>
    </section>

    <!-- REVIEW SHEET -->
    <section id="review-sheet">
      <h2>Review Sheet</h2>
      <ul id="review-list"></ul>
    </section>

  </main>

  <script src="js/6-owls.js"></script>
</body>
</html>
